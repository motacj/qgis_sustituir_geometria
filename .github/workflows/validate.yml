name: Validate QGIS plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q __init__.py plugin.py map_tool.py tools tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build plugin ZIP
        run: python tools/build_plugin.py

      - name: Validate package
        run: python tools/validate_package.py dist/qgis_sustituir_geometria.zip

      - name: Upload validated ZIP
        uses: actions/upload-artifact@v4
        with:
          name: qgis_sustituir_geometria-${{ github.sha }}
          path: dist/qgis_sustituir_geometria.zip
          if-no-files-found: error
