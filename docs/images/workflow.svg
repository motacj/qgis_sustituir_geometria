<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title description">
  <title id="title">Replace geometry with two clicks</title>
  <desc id="description">The first red feature keeps its attributes and receives the geometry of the second green feature.</desc>
  <rect width="1200" height="410" rx="28" fill="#f7f9fb"/>
  <g font-family="Arial, sans-serif" fill="#243443">
    <text x="205" y="54" text-anchor="middle" font-size="24" font-weight="700">1. Destination</text>
    <text x="600" y="54" text-anchor="middle" font-size="24" font-weight="700">2. Source geometry</text>
    <text x="995" y="54" text-anchor="middle" font-size="24" font-weight="700">3. Result</text>
    <text x="205" y="374" text-anchor="middle" font-size="19">Keeps FID + attributes</text>
    <text x="600" y="374" text-anchor="middle" font-size="19">Remains unchanged</text>
    <text x="995" y="374" text-anchor="middle" font-size="19">Undoable edit</text>
  </g>
  <path d="M85 275 L118 118 L304 95 L335 282 L212 329 Z" fill="#e64b4b22" stroke="#d92f2f" stroke-width="7"/>
  <circle cx="205" cy="207" r="13" fill="#d92f2f"/>
  <path d="M480 300 C454 214 492 112 575 98 C656 83 731 144 720 225 C709 309 628 337 480 300 Z" fill="#2eae6422" stroke="#20964f" stroke-width="7"/>
  <circle cx="600" cy="207" r="13" fill="#20964f"/>
  <path d="M875 300 C849 214 887 112 970 98 C1051 83 1126 144 1115 225 C1104 309 1023 337 875 300 Z" fill="#2eae6422" stroke="#243443" stroke-width="7"/>
  <circle cx="995" cy="207" r="13" fill="#243443"/>
  <g fill="none" stroke="#748596" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M355 207 H432"/>
    <path d="M414 187 L434 207 L414 227"/>
    <path d="M750 207 H827"/>
    <path d="M809 187 L829 207 L809 227"/>
  </g>
</svg>
